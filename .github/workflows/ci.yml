# Runs on the Cloudflare-Container-backed ephemeral self-hosted runner fleet, NOT a GitHub-hosted
# runner - see wrangler.github-runner.jsonc and src/research/cloudflare/github-runner-worker.ts. The
# `[self-hosted, cloudflare]` labels below are what routes the job here instead of ubuntu-latest; a
# workflow_job webhook (configured on the GitHub App installed on this repo) triggers a fresh
# Cloudflare Container per job, which registers, runs this, deregisters, and exits.
#
# Requires the GitHub App to be registered and installed on this repo (see the file doc comment on
# src/shadow/github-app.ts) - until then, jobs with these labels will queue and never pick up a
# runner, exactly like any self-hosted-runner workflow with no runner actually online.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 2026-09-05 (repair step 4): a job-unique label pins the ephemeral runner spawned for this job to
    # THIS job. Every runner used to register with the same two labels, so GitHub handed each new runner
    # the oldest queued job and new work was starved by its own backlog (research note, Fix 4).
    runs-on: [self-hosted, cloudflare, "diffci-job-${{ github.run_id }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1: the test suite runs real git against this checkout
          # (tests/git/*), and delta analysis of HEAD^..HEAD needs parent commits to exist.
          fetch-depth: 0
      - run: npm ci
      # 2026-09-05 (measurement-integrity repair step 3): typecheck and test are separate, NAMED steps so
      # the shadow stage classifier can attribute each one's real duration separably - a single
      # `npm run check` step (typecheck && test) can only ever be measured as inseparable test work,
      # which is honest but yields no avoidable-work estimate. Same commands, same gate, same order.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
