# TEMPORARY, one-off workflow (2026-08-22) - builds ops/github-runner/Dockerfile (Node 20 -> 22 fix,
# see docs/research/2026-08-22-preflight-p0-historical-failure-study.md Case Study #1) using a
# GitHub-hosted ubuntu-latest runner (which has Docker natively) and pushes the result to Cloudflare's
# managed container registry, since no local Docker daemon is available in the environment doing this
# work. Manually dispatched, not triggered by push/PR - this repo's real CI (.github/workflows/ci.yml)
# is unaffected. Deleted after use - not a permanent second CI system.
name: One-off build runner image
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm install -g wrangler@4.120.0
      - name: Build and push runner image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler containers build ops/github-runner -t github-runner:node22-${{ github.run_id }} --push
      - name: List images in the registry (to confirm the exact pushed reference)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler containers images list
