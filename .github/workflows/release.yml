name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish diffci to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run build:client
      - run: npm run check:oss-boundary
      - run: npm run package:smoke
      - name: Check published npm version
        id: npm_version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # --tag alpha already keeps prereleases off latest. Do not remove the stable dist-tag.
      - name: Publish stable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify published metadata
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: npm run check:public-metadata -- --remote
