name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish diffci to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run build:client
      - run: npm run check:oss-boundary
      - run: npm run package:smoke
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        run: npm publish --provenance --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # --tag alpha already keeps prereleases off latest. Do not remove the stable dist-tag.
      - name: Publish stable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
