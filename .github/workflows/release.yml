name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish diffci to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run build:client
      - run: npm run check:oss-boundary
      - run: npm run package:smoke
      - name: Check published npm version
        id: npm_version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # --tag alpha already keeps prereleases off latest. Do not remove the stable dist-tag.
      - name: Publish stable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify published metadata
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          for attempt in $(seq 1 18); do
            if npm run check:public-metadata -- --remote; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            echo "Published metadata has not propagated yet; retrying in 10 seconds ($attempt/18)."
            sleep 10
          done

  mcp-registry:
    name: Publish MCP Registry metadata
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release identity
        run: |
          node --input-type=module -e '
            import pkg from "./package.json" with { type: "json" };
            import server from "./server.json" with { type: "json" };
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tagVersion || server.version !== tagVersion) throw new Error("tag, package, and MCP versions must match");
            if (pkg.mcpName !== server.name) throw new Error("package mcpName and server name must match");
          '

      - name: Install MCP publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish and verify registry metadata
        run: |
          for attempt in $(seq 1 18); do
            if npm run registry:verify; then
              exit 0
            fi
            if ./mcp-publisher publish server.json && npm run registry:verify; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "MCP Registry publication did not converge after 18 attempts."
              exit 1
            fi
            echo "npm or registry metadata has not propagated yet; retrying in 10 seconds ($attempt/18)."
            sleep 10
          done
