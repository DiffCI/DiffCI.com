name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish diffci to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
          # Node 24 is the registry's recommended GitHub Actions runtime.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm run build:client
      - run: npm run check:oss-boundary
      - run: npm run package:smoke
      - name: Check published npm version
        id: npm_version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: |
          package_version=$(node -p "require('./package.json').version")
          prerelease_tag=$(node scripts/npm-dist-tag.mjs "$package_version")
          npm publish --provenance --access public --tag "$prerelease_tag"
        env:
          # npm prefers the GitHub OIDC identity when the package's trusted
          # publisher is configured. Keep the short-lived granular token as a
          # fallback until that external npm setting has been verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # An explicit prerelease tag keeps prereleases off latest. Do not remove the stable dist-tag.
      - name: Publish stable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && steps.npm_version.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify published metadata
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          for attempt in $(seq 1 18); do
            if npm run check:public-metadata -- --remote; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            echo "Published metadata has not propagated yet; retrying in 10 seconds ($attempt/18)."
            sleep 10
          done
