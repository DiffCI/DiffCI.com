name: DiffCI observation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  diffci:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Package-distribution canary. The local Action is dogfooded separately in
      # diffci-observe.yml; this command stays analysis-only to avoid duplicating CI tests.
      # Run outside the checkout so npm cannot mistake this package for the registry install.
      - run: |
          cd "$RUNNER_TEMP"
          npx --yes --package "@diffci.com/diffci@0.2.10" diffci observe --repo "$GITHUB_WORKSPACE" --no-send
